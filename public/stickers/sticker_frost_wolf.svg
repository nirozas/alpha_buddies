<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="ice-fur" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#E0F2FE"/>
        <stop offset="60%" stop-color="#7DD3FC"/>
        <stop offset="100%" stop-color="#0284C7"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Pointy Wolf Ears -->
    <polygon points="75,65 55,20 100,45" fill="#0284C7"/>
    <polygon points="75,65 65,35 90,48" fill="#E0F2FE"/>
    <polygon points="165,65 185,20 140,45" fill="#0284C7"/>
    <polygon points="165,65 175,35 150,48" fill="#E0F2FE"/>
    <!-- Head & Body -->
    <ellipse cx="120" cy="140" rx="48" ry="52" fill="url(#ice-fur)"/>
    <circle cx="120" cy="85" r="42" fill="url(#ice-fur)"/>
    <!-- Snout & Eyes -->
    <polygon points="120,90 105,115 135,115" fill="#FFFFFF"/>
    <circle cx="120" cy="98" r="5" fill="#0F172A"/>
    <circle cx="100" cy="80" r="9" fill="#0F172A"/>
    <circle cx="140" cy="80" r="9" fill="#0F172A"/>
    <circle cx="97" cy="77" r="3.5" fill="#FFFFFF"/>
    <circle cx="137" cy="77" r="3.5" fill="#FFFFFF"/>
    <use href="#sparkle" x="50" y="110"/>
    <use href="#sparkle" x="190" y="110"/>
    <use href="#gold-star" x="120" y="150"/>
  </svg>