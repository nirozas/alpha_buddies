<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Llama Neck & Head -->
    <rect x="100" y="80" width="40" height="70" rx="20" fill="#FAF5FF"/>
    <circle cx="120" cy="85" r="30" fill="#FAF5FF"/>
    <!-- Ears -->
    <polygon points="102,65 98,35 110,60" fill="#E9D5FF"/>
    <polygon points="138,65 142,35 130,60" fill="#E9D5FF"/>
    <!-- Blanket of Stars -->
    <rect x="95" y="130" width="50" height="30" rx="6" fill="#C084FC"/>
    <circle cx="105" cy="145" r="4" fill="#FDE047"/>
    <circle cx="120" cy="145" r="4" fill="#38BDF8"/>
    <circle cx="135" cy="145" r="4" fill="#F472B6"/>
    <!-- Cute Face -->
    <circle cx="110" cy="82" r="6" fill="#0F172A"/>
    <circle cx="130" cy="82" r="6" fill="#0F172A"/>
    <circle cx="108" cy="80" r="2" fill="#FFF"/>
    <circle cx="128" cy="80" r="2" fill="#FFF"/>
    <ellipse cx="120" cy="92" rx="8" ry="6" fill="#F3E8FF"/>
    <circle cx="120" cy="90" r="3" fill="#6B21A8"/>
    <use href="#sparkle" x="60" y="60"/>
    <use href="#sparkle" x="180" y="60"/>
  
</svg>