<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="prism-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#F43F5E"/>
        <stop offset="25%" stop-color="#FBBF24"/>
        <stop offset="50%" stop-color="#34D399"/>
        <stop offset="75%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#A855F7"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Spiral Tail -->
    <path d="M50 145 C30 175 75 195 85 165 C90 145 75 135 65 145" fill="none" stroke="url(#prism-grad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="130" cy="130" rx="55" ry="42" fill="url(#prism-grad)"/>
    <!-- Head & Crest -->
    <circle cx="145" cy="90" r="38" fill="url(#prism-grad)"/>
    <polygon points="125,65 140,40 160,65" fill="#F43F5E"/>
    <!-- Big Googly Chamelon Eye -->
    <circle cx="145" cy="90" r="20" fill="#FEF08A"/>
    <circle cx="150" cy="88" r="9" fill="#0F172A"/>
    <circle cx="148" cy="85" r="3.5" fill="#FFFFFF"/>
    <!-- Cheeky Smile -->
    <path d="M165 110 Q175 115 185 105" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>
    <use href="#sparkle" x="50" y="60"/>
    <use href="#sparkle" x="195" y="60"/>
  </svg>