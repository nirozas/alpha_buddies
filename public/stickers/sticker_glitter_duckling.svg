  <circle cx="210" cy="168" r="7" fill="#FFFFFF"/>
  <circle cx="218" cy="183" r="3" fill="#FFFFFF"/>
  <ellipse cx="297" cy="175" rx="16" ry="22" fill="#1E293B"/>
  <circle cx="292" cy="168" r="7" fill="#FFFFFF"/>
