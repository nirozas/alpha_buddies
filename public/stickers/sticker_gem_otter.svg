<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="gem-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#F472B6"/>
        <stop offset="50%" stop-color="#C084FC"/>
        <stop offset="100%" stop-color="#38BDF8"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C180 25 210 65 210 125 C210 185 175 215 120 215 C65 215 30 185 30 125 C30 65 60 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Body & Round Ears -->
    <circle cx="65" cy="65" r="14" fill="#78350F"/>
    <circle cx="175" cy="65" r="14" fill="#78350F"/>
    <ellipse cx="120" cy="140" rx="55" ry="60" fill="#92400E"/>
    <circle cx="120" cy="85" r="45" fill="#92400E"/>
    <!-- Cream Snout -->
    <ellipse cx="120" cy="98" rx="22" ry="15" fill="#FEF3C7"/>
    <ellipse cx="120" cy="92" rx="8" ry="6" fill="#0F172A"/>
    <!-- Big Heart Gem Held in Paws -->
    <path d="M120 135 C110 115 80 120 80 145 C80 170 120 185 120 185 C120 185 160 170 160 145 C160 120 130 115 120 135 Z" fill="url(#gem-grad)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="98" cy="78" r="9" fill="#0F172A"/>
    <circle cx="142" cy="78" r="9" fill="#0F172A"/>
    <circle cx="95" cy="75" r="3.5" fill="#FFFFFF"/>
    <circle cx="139" cy="75" r="3.5" fill="#FFFFFF"/>
    <use href="#sparkle" x="50" y="100"/>
    <use href="#sparkle" x="190" y="100"/>
    <use href="#sparkle" x="120" y="145"/>
  </svg>