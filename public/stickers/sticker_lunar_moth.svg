<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="moth-wing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#A7F3D0"/>
        <stop offset="50%" stop-color="#34D399"/>
        <stop offset="100%" stop-color="#059669"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Giant Shimmering Wings -->
    <path d="M120 115 C70 40 30 70 45 130 C55 170 100 150 120 135 Z" fill="url(#moth-wing)"/>
    <path d="M120 115 C170 40 210 70 195 130 C185 170 140 150 120 135 Z" fill="url(#moth-wing)"/>
    <!-- Moon Eyespots on Wings -->
    <circle cx="75" cy="105" r="10" fill="#FEF08A"/>
    <circle cx="75" cy="105" r="6" fill="#818CF8"/>
    <circle cx="165" cy="105" r="10" fill="#FEF08A"/>
    <circle cx="165" cy="105" r="6" fill="#818CF8"/>
    <!-- Fluffy Body & Feathery Antennae -->
    <path d="M115 75 Q95 45 80 40" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
    <path d="M125 75 Q145 45 160 40" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="120" cy="120" rx="16" ry="38" fill="#F8FAFC"/>
    <circle cx="120" cy="85" r="16" fill="#F8FAFC"/>
    <!-- Big Glossy Eyes -->
    <circle cx="112" cy="85" r="6" fill="#0F172A"/>
    <circle cx="128" cy="85" r="6" fill="#0F172A"/>
    <use href="#sparkle" x="120" y="35"/>
    <use href="#sparkle" x="50" y="145"/>
    <use href="#sparkle" x="190" y="145"/>
  </svg>