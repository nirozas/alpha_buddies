<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Majestic Fiery Galactic Wings -->
    <path d="M50 120 Q30 60 90 85 Q70 120 120 130" fill="#F43F5E"/>
    <path d="M190 120 Q210 60 150 85 Q170 120 120 130" fill="#F43F5E"/>
    <!-- Phoenix Body -->
    <circle cx="120" cy="120" r="38" fill="#FB923C"/>
    <!-- Golden Flame Crest -->
    <polygon points="120,40 110,75 130,75" fill="#FDE047"/>
    <polygon points="105,55 100,80 115,80" fill="#F97316"/>
    <polygon points="135,55 140,80 125,80" fill="#F97316"/>
    <!-- Eyes & Beak -->
    <circle cx="108" cy="115" r="6" fill="#0F172A"/>
    <circle cx="132" cy="115" r="6" fill="#0F172A"/>
    <polygon points="120,122 113,130 127,130" fill="#FDE047"/>
    <use href="#gold-star" x="120" y="165"/>
    <use href="#sparkle" x="50" y="55"/>
    <use href="#sparkle" x="190" y="55"/>
  
</svg>