<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="time-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="50%" stop-color="#818CF8"/>
        <stop offset="100%" stop-color="#C084FC"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Small Wings -->
    <polygon points="65,95 35,60 85,75" fill="#38BDF8"/>
    <polygon points="175,95 205,60 155,75" fill="#38BDF8"/>
    <!-- Body & Head -->
    <ellipse cx="120" cy="140" rx="48" ry="52" fill="url(#time-grad)"/>
    <circle cx="120" cy="85" r="42" fill="url(#time-grad)"/>
    <!-- Hourglass Locket -->
    <polygon points="110,135 130,135 110,165 130,165" fill="#FACC15" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="102" cy="82" r="10" fill="#0F172A"/>
    <circle cx="138" cy="82" r="10" fill="#0F172A"/>
    <circle cx="99" cy="78" r="3.5" fill="#FFFFFF"/>
    <circle cx="135" cy="78" r="3.5" fill="#FFFFFF"/>
    <use href="#sparkle" x="50" y="70"/>
    <use href="#sparkle" x="190" y="70"/>
    <use href="#gold-star" x="120" y="35"/>
  </svg>