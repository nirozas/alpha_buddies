<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Dragon Horns -->
    <path d="M85 85 Q65 40 90 45" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M155 85 Q175 40 150 45" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Cosmic Dragon Head -->
    <circle cx="120" cy="120" r="48" fill="#6366F1"/>
    <!-- Infinity Gem on Forehead -->
    <polygon points="120,80 128,92 120,104 112,92" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Big Friendly Eyes -->
    <circle cx="100" cy="118" r="9" fill="#0F172A"/>
    <circle cx="140" cy="118" r="9" fill="#0F172A"/>
    <circle cx="98" cy="115" r="3.5" fill="#FFF"/>
    <circle cx="138" cy="115" r="3.5" fill="#FFF"/>
    <!-- Cute Dragon Smile -->
    <path d="M112 135 Q120 142 128 135" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <use href="#sparkle" x="50" y="60"/>
    <use href="#sparkle" x="190" y="60"/>
    <use href="#gold-star" x="120" y="165"/>
  
</svg>