<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Swirl Tail -->
    <path d="M70 140 C50 160 50 190 75 185 C95 180 85 155 75 160" stroke="#10B981" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Chameleon Body -->
    <ellipse cx="125" cy="130" rx="45" ry="38" fill="#34D399"/>
    <!-- Rainbow Crest -->
    <path d="M110 95 Q140 70 165 95" stroke="#F43F5E" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Turret Eye -->
    <circle cx="145" cy="120" r="14" fill="#6EE7B7"/>
    <circle cx="145" cy="120" r="6" fill="#0F172A"/>
    <circle cx="143" cy="118" r="2" fill="#FFFFFF"/>
    <!-- Cute Tongue Catching Star -->
    <path d="M165 135 Q185 135 195 125" stroke="#FB7185" stroke-width="3" fill="none"/>
    <use href="#gold-star" x="195" y="125"/>
    <use href="#sparkle" x="60" y="65"/>
    <use href="#sparkle" x="120" y="55"/>
  
</svg>