<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <g fill="#FEF2F2" stroke="#FBCFE8" stroke-width="2">
      <circle cx="80" cy="130" r="32"/>
      <circle cx="160" cy="130" r="32"/>
      <circle cx="120" cy="150" r="38"/>
      <circle cx="120" cy="110" r="42"/>
    </g>
    <ellipse cx="120" cy="122" rx="26" ry="22" fill="#FFE4E6"/>
    <!-- Horns -->
    <path d="M92 102 Q84 90 94 82" stroke="#FDE047" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M148 102 Q156 90 146 82" stroke="#FDE047" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="108" cy="120" r="6" fill="#0F172A"/>
    <circle cx="132" cy="120" r="6" fill="#0F172A"/>
    <circle cx="106" cy="118" r="2" fill="#FFF"/>
    <circle cx="130" cy="118" r="2" fill="#FFF"/>
    <circle cx="100" cy="128" r="4" fill="#F472B6" opacity="0.6"/>
    <circle cx="140" cy="128" r="4" fill="#F472B6" opacity="0.6"/>
    <use href="#sparkle" x="65" y="75"/>
    <use href="#sparkle" x="175" y="75"/>
  
</svg>