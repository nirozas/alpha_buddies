<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Pixie Wings -->
    <ellipse cx="75" cy="85" rx="25" ry="40" fill="#A7F3D0" opacity="0.8" transform="rotate(-30 75 85)"/>
    <ellipse cx="165" cy="85" rx="25" ry="40" fill="#A7F3D0" opacity="0.8" transform="rotate(30 165 85)"/>
    <!-- Glowing Lantern Belly -->
    <circle cx="120" cy="155" r="30" fill="#FDE047" filter="url(#soft-glow)"/>
    <!-- Head -->
    <circle cx="120" cy="105" r="28" fill="#10B981"/>
    <!-- Eyes -->
    <circle cx="108" cy="105" r="6" fill="#0F172A"/>
    <circle cx="132" cy="105" r="6" fill="#0F172A"/>
    <circle cx="106" cy="103" r="2" fill="#FFF"/>
    <circle cx="130" cy="103" r="2" fill="#FFF"/>
    <!-- Antennae -->
    <path d="M112 80 Q105 60 95 62" stroke="#047857" stroke-width="2.5" fill="none"/>
    <circle cx="95" cy="62" r="4" fill="#FDE047"/>
    <path d="M128 80 Q135 60 145 62" stroke="#047857" stroke-width="2.5" fill="none"/>
    <circle cx="145" cy="62" r="4" fill="#FDE047"/>
    <use href="#sparkle" x="50" y="60"/>
    <use href="#sparkle" x="190" y="60"/>
  
</svg>