<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <radialGradient id="gummy-grad" cx="40%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FDA4AF"/>
        <stop offset="50%" stop-color="#FB7185"/>
        <stop offset="100%" stop-color="#BE123C"/>
      </radialGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Round Gummy Ears -->
    <circle cx="70" cy="65" r="20" fill="url(#gummy-grad)"/>
    <circle cx="170" cy="65" r="20" fill="url(#gummy-grad)"/>
    <!-- Body & Head -->
    <ellipse cx="120" cy="145" rx="55" ry="58" fill="url(#gummy-grad)"/>
    <circle cx="120" cy="90" r="45" fill="url(#gummy-grad)"/>
    <!-- Glass Highlights -->
    <ellipse cx="105" cy="70" rx="14" ry="7" transform="rotate(-30 105 70)" fill="#FFFFFF" opacity="0.6"/>
    <ellipse cx="95" cy="130" rx="16" ry="8" transform="rotate(-30 95 130)" fill="#FFFFFF" opacity="0.5"/>
    <!-- Eyes & Snout -->
    <circle cx="102" cy="88" r="8" fill="#881337"/>
    <circle cx="138" cy="88" r="8" fill="#881337"/>
    <circle cx="100" cy="85" r="2.5" fill="#FFFFFF"/>
    <circle cx="136" cy="85" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="120" cy="100" rx="12" ry="8" fill="#FDA4AF"/>
    <circle cx="120" cy="98" r="4" fill="#881337"/>
    <use href="#sparkle" x="50" y="110"/>
    <use href="#sparkle" x="190" y="110"/>
    <use href="#gold-star" x="120" y="145"/>
  </svg>