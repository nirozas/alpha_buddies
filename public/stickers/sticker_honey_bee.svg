<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
  </defs>
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  <!-- Translucent Glitter Wings -->
  <ellipse cx="85" cy="75" rx="30" ry="45" fill="#E0F2FE" opacity="0.85" transform="rotate(-30 85 75)" stroke="#38BDF8" stroke-width="2"/>
  <ellipse cx="155" cy="75" rx="30" ry="45" fill="#E0F2FE" opacity="0.85" transform="rotate(30 155 75)" stroke="#38BDF8" stroke-width="2"/>
  <!-- Fuzzy Bee Body -->
  <ellipse cx="120" cy="130" rx="55" ry="50" fill="#FACC15"/>
  <!-- Bee Stripes -->
  <path d="M72 115 Q120 125 168 115" stroke="#0F172A" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M78 142 Q120 152 162 142" stroke="#0F172A" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Cheerful Eyes -->
  <circle cx="102" cy="115" r="8" fill="#0F172A"/>
  <circle cx="138" cy="115" r="8" fill="#0F172A"/>
  <circle cx="99" cy="112" r="3" fill="#FFFFFF"/>
  <circle cx="135" cy="112" r="3" fill="#FFFFFF"/>
  <!-- Blush -->
  <circle cx="88" cy="125" r="7" fill="#F472B6" opacity="0.6"/>
  <circle cx="152" cy="125" r="7" fill="#F472B6" opacity="0.6"/>
  <!-- Tiny Crown of Daisies -->
  <polygon points="98,72 105,58 112,68 120,52 128,68 135,58 142,72" fill="#FDE047" stroke="#EAB308" stroke-width="2"/>
  <!-- Stinger (friendly rounded heart) -->
  <circle cx="120" cy="180" r="6" fill="#F97316"/>
  <use href="#sparkle" x="50" y="60"/>
  <use href="#sparkle" x="190" y="60"/>
  <use href="#sparkle" x="120" y="42"/>
</svg>
