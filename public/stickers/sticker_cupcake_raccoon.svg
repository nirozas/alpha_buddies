<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Raccoon Head -->
    <polygon points="80,105 70,70 100,95" fill="#64748B"/>
    <polygon points="160,105 170,70 140,95" fill="#64748B"/>
    <circle cx="120" cy="125" r="45" fill="#94A3B8"/>
    <!-- Mask -->
    <ellipse cx="98" cy="122" rx="16" ry="10" fill="#334155" transform="rotate(-10 98 122)"/>
    <ellipse cx="142" cy="122" rx="16" ry="10" fill="#334155" transform="rotate(10 142 122)"/>
    <!-- Eyes -->
    <circle cx="98" cy="122" r="6" fill="#FFFFFF"/>
    <circle cx="142" cy="122" r="6" fill="#FFFFFF"/>
    <circle cx="99" cy="122" r="4" fill="#0F172A"/>
    <circle cx="141" cy="122" r="4" fill="#0F172A"/>
    <!-- Snout -->
    <ellipse cx="120" cy="134" rx="10" ry="7" fill="#FFFFFF"/>
    <circle cx="120" cy="131" r="3" fill="#0F172A"/>
    <!-- Frosted Cupcake -->
    <path d="M102 165 L106 185 L134 185 L138 165 Z" fill="#FDE047"/>
    <circle cx="120" cy="160" r="14" fill="#F472B6"/>
    <circle cx="120" cy="148" r="4" fill="#EF4444"/>
    <use href="#sparkle" x="65" y="75"/>
    <use href="#sparkle" x="175" y="75"/>
  
</svg>