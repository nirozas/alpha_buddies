<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <circle cx="120" cy="125" r="42" fill="#FDBA74"/>
    <ellipse cx="80" cy="85" rx="10" ry="24" fill="#FED7AA" transform="rotate(-35 80 85)"/>
    <ellipse cx="160" cy="85" rx="10" ry="24" fill="#FED7AA" transform="rotate(35 160 85)"/>
    <!-- Golden Star Antlers -->
    <path d="M95 90 L85 55 M85 70 L70 65" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <path d="M145 90 L155 55 M155 70 L170 65" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="85" cy="55" r="4" fill="#FDE047"/>
    <circle cx="155" cy="55" r="4" fill="#FDE047"/>
    <!-- Eyes -->
    <ellipse cx="104" cy="122" rx="7" ry="9" fill="#0F172A"/>
    <ellipse cx="136" cy="122" rx="7" ry="9" fill="#0F172A"/>
    <circle cx="102" cy="119" r="3" fill="#FFF"/>
    <circle cx="134" cy="119" r="3" fill="#FFF"/>
    <circle cx="120" cy="100" r="3" fill="#FFF"/>
    <ellipse cx="120" cy="138" rx="8" ry="6" fill="#FFF"/>
    <circle cx="120" cy="135" r="2.5" fill="#9A3412"/>
    <use href="#sparkle" x="55" y="70"/>
    <use href="#sparkle" x="185" y="70"/>
  
</svg>