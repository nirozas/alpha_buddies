<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="bolt-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FEF08A"/>
        <stop offset="100%" stop-color="#EAB308"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Thunder Tails -->
    <polygon points="65,150 35,130 50,110 25,95 60,85 70,120" fill="url(#bolt-grad)"/>
    <polygon points="175,150 205,130 190,110 215,95 180,85 170,120" fill="url(#bolt-grad)"/>
    <!-- Head & Big Fox Ears -->
    <polygon points="80,75 55,25 105,45" fill="#F97316"/>
    <polygon points="80,75 68,38 98,52" fill="#FEF08A"/>
    <polygon points="160,75 185,25 135,45" fill="#F97316"/>
    <polygon points="160,75 172,38 142,52" fill="#FEF08A"/>
    <!-- Body -->
    <ellipse cx="120" cy="140" rx="45" ry="50" fill="#F97316"/>
    <circle cx="120" cy="90" r="42" fill="#F97316"/>
    <polygon points="120,95 95,120 145,120" fill="#FFFFFF"/>
    <!-- Eyes -->
    <circle cx="102" cy="85" r="9" fill="#0F172A"/>
    <circle cx="138" cy="85" r="9" fill="#0F172A"/>
    <circle cx="99" cy="82" r="3.5" fill="#FFFFFF"/>
    <circle cx="135" cy="82" r="3.5" fill="#FFFFFF"/>
    <use href="#sparkle" x="40" y="65"/>
    <use href="#sparkle" x="200" y="65"/>
    <use href="#gold-star" x="120" y="155"/>
  </svg>