<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Floppy Bunny Ears -->
    <ellipse cx="85" cy="70" rx="14" ry="40" fill="#FCE7F3" stroke="#F472B6" stroke-width="2" transform="rotate(-15 85 70)"/>
    <ellipse cx="85" cy="70" rx="7" ry="25" fill="#F472B6" opacity="0.4" transform="rotate(-15 85 70)"/>
    <ellipse cx="155" cy="70" rx="14" ry="40" fill="#FCE7F3" stroke="#F472B6" stroke-width="2" transform="rotate(15 155 70)"/>
    <ellipse cx="155" cy="70" rx="7" ry="25" fill="#F472B6" opacity="0.4" transform="rotate(15 155 70)"/>
    <!-- Fluffy Head & Body -->
    <circle cx="120" cy="135" r="50" fill="#FFF1F2"/>
    <!-- Eyes -->
    <circle cx="102" cy="125" r="8" fill="#0F172A"/>
    <circle cx="138" cy="125" r="8" fill="#0F172A"/>
    <circle cx="99" cy="122" r="3" fill="#FFFFFF"/>
    <circle cx="135" cy="122" r="3" fill="#FFFFFF"/>
    <!-- Nose & Mouth -->
    <polygon points="120,133 116,138 124,138" fill="#FB7185"/>
    <path d="M116 142 Q120 146 124 142" stroke="#FB7185" stroke-width="2" fill="none"/>
    <!-- Cheeks -->
    <circle cx="88" cy="135" r="7" fill="#F43F5E" opacity="0.35"/>
    <circle cx="152" cy="135" r="7" fill="#F43F5E" opacity="0.35"/>
    <use href="#sparkle" x="55" y="80"/>
    <use href="#sparkle" x="185" y="80"/>
    <use href="#gold-star" x="120" y="85"/>
  
</svg>