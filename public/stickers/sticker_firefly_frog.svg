<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FEF08A"/>
        <stop offset="60%" stop-color="#FACC15"/>
        <stop offset="100%" stop-color="#CA8A04"/>
      </radialGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Big Frog Eyes on Top -->
    <circle cx="85" cy="70" r="24" fill="#4ADE80"/>
    <circle cx="155" cy="70" r="24" fill="#4ADE80"/>
    <circle cx="85" cy="70" r="13" fill="#0F172A"/>
    <circle cx="155" cy="70" r="13" fill="#0F172A"/>
    <circle cx="82" cy="66" r="4.5" fill="#FFFFFF"/>
    <circle cx="152" cy="66" r="4.5" fill="#FFFFFF"/>
    <!-- Body & Face -->
    <ellipse cx="120" cy="135" rx="58" ry="50" fill="#22C55E"/>
    <!-- Glowing Lantern Belly -->
    <ellipse cx="120" cy="145" rx="36" ry="32" fill="url(#lantern-glow)" filter="url(#soft-glow)"/>
    <!-- Wide Happy Frog Mouth -->
    <path d="M95 105 Q120 125 145 105" stroke="#14532D" stroke-width="4" stroke-linecap="round" fill="none"/>
    <use href="#sparkle" x="50" y="125"/>
    <use href="#sparkle" x="190" y="125"/>
    <use href="#gold-star" x="120" y="145"/>
  </svg>