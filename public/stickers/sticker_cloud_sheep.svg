<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Fluffy Cloud Body -->
    <g fill="#F0FDF4" stroke="#E2E8F0" stroke-width="2">
      <circle cx="80" cy="130" r="35"/>
      <circle cx="160" cy="130" r="35"/>
      <circle cx="120" cy="150" r="40"/>
      <circle cx="120" cy="110" r="45"/>
      <circle cx="90" cy="90" r="30"/>
      <circle cx="150" cy="90" r="30"/>
    </g>
    <!-- Cute Sheep Face -->
    <ellipse cx="120" cy="120" rx="28" ry="25" fill="#FFE4E6"/>
    <!-- Horns -->
    <path d="M90 100 Q80 85 92 75 Q102 85 95 100" fill="#FDE047"/>
    <path d="M150 100 Q160 85 148 75 Q138 85 145 100" fill="#FDE047"/>
    <!-- Eyes -->
    <circle cx="108" cy="118" r="6" fill="#0F172A"/>
    <circle cx="132" cy="118" r="6" fill="#0F172A"/>
    <circle cx="106" cy="116" r="2" fill="#FFFFFF"/>
    <circle cx="130" cy="116" r="2" fill="#FFFFFF"/>
    <circle cx="100" cy="126" r="4" fill="#F472B6" opacity="0.6"/>
    <circle cx="140" cy="126" r="4" fill="#F472B6" opacity="0.6"/>
    <!-- Rainbow Drops -->
    <circle cx="70" cy="185" r="6" fill="#38BDF8"/>
    <circle cx="120" cy="195" r="7" fill="#F472B6"/>
    <circle cx="170" cy="185" r="6" fill="#A855F7"/>
    <use href="#sparkle" x="50" y="55"/>
    <use href="#sparkle" x="190" y="55"/>
  </svg>