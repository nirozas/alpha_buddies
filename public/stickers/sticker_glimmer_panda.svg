<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Black Ears -->
    <circle cx="65" cy="65" r="22" fill="#0F172A"/>
    <circle cx="175" cy="65" r="22" fill="#0F172A"/>
    <!-- Body & Head -->
    <ellipse cx="120" cy="150" rx="55" ry="50" fill="#0F172A"/>
    <ellipse cx="120" cy="155" rx="38" ry="38" fill="#F8FAFC"/>
    <circle cx="120" cy="95" r="48" fill="#F8FAFC"/>
    <!-- Eye Patches -->
    <ellipse cx="95" cy="95" rx="16" ry="14" transform="rotate(-15 95 95)" fill="#0F172A"/>
    <ellipse cx="145" cy="95" rx="16" ry="14" transform="rotate(15 145 95)" fill="#0F172A"/>
    <circle cx="95" cy="93" r="6" fill="#38BDF8"/>
    <circle cx="145" cy="93" r="6" fill="#38BDF8"/>
    <circle cx="93" cy="91" r="2.5" fill="#FFFFFF"/>
    <circle cx="143" cy="91" r="2.5" fill="#FFFFFF"/>
    <!-- Nose & Mouth -->
    <ellipse cx="120" cy="107" rx="8" ry="6" fill="#0F172A"/>
    <path d="M120 113 Q115 119 110 116 M120 113 Q125 119 130 116" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Jade Bamboo Shoot -->
    <rect x="114" y="130" width="12" height="40" rx="4" fill="#34D399"/>
    <polygon points="126,135 145,130 126,145" fill="#10B981"/>
    <use href="#sparkle" x="50" y="115"/>
    <use href="#sparkle" x="190" y="115"/>
    <use href="#gold-star" x="120" y="40"/>
  </svg>