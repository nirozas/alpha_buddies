  <path d="M190 270 Q256 315 322 270" stroke="#0F172A" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Blushing pink cheeks -->
  <circle cx="170" cy="270" r="16" fill="#F472B6" opacity="0.8"/>
  <circle cx="342" cy="270" r="16" fill="#F472B6" opacity="0.8"/>
