  <!-- Big Bulbous Eyes on Top -->
  <circle cx="190" cy="190" r="45" fill="url(#neonFrog)"/>
  <circle cx="190" cy="190" r="30" fill="#FFFFFF"/>
  <circle cx="190" cy="190" r="18" fill="#0F172A"/>
  <circle cx="185" cy="182" r="6" fill="#FFFFFF"/>
  <circle cx="322" cy="190" r="45" fill="url(#neonFrog)"/>
  <circle cx="322" cy="190" r="30" fill="#FFFFFF"/>
  <circle cx="322" cy="190" r="18" fill="#0F172A"/>
  <circle cx="317" cy="182" r="6" fill="#FFFFFF"/>
