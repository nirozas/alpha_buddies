<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neonFrog" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4ADE80"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#A855F7"/></linearGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="#F0FDF4" opacity="0.6"/>
  <!-- Giant Floating Lotus Leaf -->
  <ellipse cx="256" cy="370" rx="180" ry="60" fill="#15803D" opacity="0.8"/>
  <ellipse cx="256" cy="365" rx="160" ry="50" fill="#22C55E"/>
