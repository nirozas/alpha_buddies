<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="ember-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FDE047"/>
        <stop offset="60%" stop-color="#F97316"/>
        <stop offset="100%" stop-color="#DC2626"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C180 25 210 65 210 125 C210 185 175 215 120 215 C65 215 30 185 30 125 C30 65 60 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Ears -->
    <polygon points="65,60 50,30 85,45" fill="#F97316"/>
    <polygon points="175,60 190,30 155,45" fill="#F97316"/>
    <!-- Body & Head -->
    <ellipse cx="120" cy="140" rx="52" ry="55" fill="url(#ember-grad)"/>
    <circle cx="120" cy="85" r="45" fill="url(#ember-grad)"/>
    <!-- Cheetah Spots -->
    <circle cx="100" cy="60" r="4" fill="#7C2D12"/>
    <circle cx="140" cy="60" r="4" fill="#7C2D12"/>
    <circle cx="120" cy="50" r="4" fill="#7C2D12"/>
    <circle cx="85" cy="135" r="5" fill="#7C2D12"/>
    <circle cx="155" cy="135" r="5" fill="#7C2D12"/>
    <!-- Fiery Paws -->
    <circle cx="85" cy="185" r="14" fill="#FACC15"/>
    <circle cx="155" cy="185" r="14" fill="#FACC15"/>
    <!-- Big Anime Eyes -->
    <ellipse cx="98" cy="85" rx="10" ry="13" fill="#0F172A"/>
    <ellipse cx="142" cy="85" rx="10" ry="13" fill="#0F172A"/>
    <circle cx="95" cy="80" r="4" fill="#FFFFFF"/>
    <circle cx="139" cy="80" r="4" fill="#FFFFFF"/>
    <use href="#sparkle" x="50" y="90"/>
    <use href="#sparkle" x="190" y="90"/>
    <use href="#gold-star" x="120" y="145"/>
  </svg>