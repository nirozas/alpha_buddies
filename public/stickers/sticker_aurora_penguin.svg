<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="aurora-belly" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#67E8F9"/>
        <stop offset="50%" stop-color="#C084FC"/>
        <stop offset="100%" stop-color="#F472B6"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C180 25 210 65 210 125 C210 185 175 215 120 215 C65 215 30 185 30 125 C30 65 60 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Flippers -->
    <ellipse cx="55" cy="135" rx="16" ry="32" transform="rotate(20 55 135)" fill="#0F172A"/>
    <ellipse cx="185" cy="135" rx="16" ry="32" transform="rotate(-20 185 135)" fill="#0F172A"/>
    <!-- Body -->
    <ellipse cx="120" cy="125" rx="60" ry="75" fill="#0F172A"/>
    <!-- Aurora Belly -->
    <ellipse cx="120" cy="135" rx="42" ry="58" fill="url(#aurora-belly)"/>
    <!-- Feet -->
    <ellipse cx="95" cy="200" rx="15" ry="8" fill="#F59E0B"/>
    <ellipse cx="145" cy="200" rx="15" ry="8" fill="#F59E0B"/>
    <!-- Eyes -->
    <circle cx="100" cy="85" r="10" fill="#FFFFFF"/>
    <circle cx="140" cy="85" r="10" fill="#FFFFFF"/>
    <circle cx="100" cy="85" r="6" fill="#0F172A"/>
    <circle cx="140" cy="85" r="6" fill="#0F172A"/>
    <circle cx="98" cy="83" r="2.5" fill="#FFFFFF"/>
    <circle cx="138" cy="83" r="2.5" fill="#FFFFFF"/>
    <!-- Beak -->
    <polygon points="120,90 110,105 130,105" fill="#F59E0B"/>
    <use href="#sparkle" x="50" y="70"/>
    <use href="#sparkle" x="190" y="70"/>
    <use href="#sparkle" x="120" y="145"/>
  </svg>