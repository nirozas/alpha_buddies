<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Hamster Body with Lightning -->
    <ellipse cx="120" cy="135" rx="52" ry="46" fill="#FBBF24"/>
    <!-- Zap Tail / Bolt -->
    <polygon points="120,55 126,75 116,78 126,100 114,82 122,80" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
    <!-- Big Cheeks -->
    <ellipse cx="85" cy="140" rx="18" ry="14" fill="#FDE047"/>
    <ellipse cx="155" cy="140" rx="18" ry="14" fill="#FDE047"/>
    <circle cx="85" cy="142" r="7" fill="#EF4444" opacity="0.6"/>
    <circle cx="155" cy="142" r="7" fill="#EF4444" opacity="0.6"/>
    <!-- Eyes -->
    <circle cx="104" cy="120" r="7" fill="#0F172A"/>
    <circle cx="136" cy="120" r="7" fill="#0F172A"/>
    <circle cx="102" cy="118" r="2.5" fill="#FFF"/>
    <circle cx="134" cy="118" r="2.5" fill="#FFF"/>
    <use href="#sparkle" x="50" y="70"/>
    <use href="#sparkle" x="190" y="70"/>
  
</svg>