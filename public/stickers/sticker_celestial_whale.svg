<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="whale-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="50%" stop-color="#6366F1"/>
        <stop offset="100%" stop-color="#1E1B4B"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Whale Body -->
    <path d="M55 140 C55 90 140 70 185 110 C205 130 185 160 140 160 C80 160 55 160 55 140 Z" fill="url(#whale-grad)"/>
    <!-- Tail Fin -->
    <polygon points="55,140 30,115 40,140 25,160 55,145" fill="#38BDF8"/>
    <!-- Flipper -->
    <ellipse cx="125" cy="145" rx="20" ry="10" transform="rotate(25 125 145)" fill="#60A5FA"/>
    <!-- Belly Grooves -->
    <path d="M110 155 Q140 155 165 140" stroke="#BAE6FD" stroke-width="3" fill="none"/>
    <!-- Eye & Blowhole Stars -->
    <circle cx="160" cy="115" r="7" fill="#0F172A"/>
    <circle cx="158" cy="113" r="2.5" fill="#FFFFFF"/>
    <!-- Starlight Spout -->
    <use href="#sparkle" x="145" y="65"/>
    <use href="#sparkle" x="160" y="50"/>
    <use href="#gold-star" x="135" y="45"/>
    <use href="#sparkle" x="75" y="85"/>
  </svg>