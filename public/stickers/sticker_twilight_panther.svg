<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Panther Ears -->
    <polygon points="75,95 65,55 105,80" fill="#4C1D95"/>
    <polygon points="165,95 175,55 135,80" fill="#4C1D95"/>
    <!-- Head -->
    <circle cx="120" cy="125" r="46" fill="#5B21B6"/>
    <!-- Glowing Violet Eyes -->
    <ellipse cx="100" cy="118" rx="8" ry="10" fill="#C084FC"/>
    <ellipse cx="140" cy="118" rx="8" ry="10" fill="#C084FC"/>
    <circle cx="100" cy="118" r="4" fill="#0F172A"/>
    <circle cx="140" cy="118" r="4" fill="#0F172A"/>
    <!-- Snout & Whiskers -->
    <ellipse cx="120" cy="136" rx="12" ry="8" fill="#7C3AED"/>
    <circle cx="120" cy="133" r="3" fill="#F472B6"/>
    <use href="#sparkle" x="55" y="65"/>
    <use href="#sparkle" x="185" y="65"/>
    <use href="#sparkle" x="120" y="45"/>
  
</svg>