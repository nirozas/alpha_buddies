<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="turtle-shell" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#34D399"/>
        <stop offset="50%" stop-color="#059669"/>
        <stop offset="100%" stop-color="#064E3B"/>
      </linearGradient>
      <linearGradient id="turtle-skin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#A7F3D0"/>
        <stop offset="100%" stop-color="#6EE7B7"/>
      </linearGradient>
    </defs>
    <!-- White Die-Cut Border -->
    <path d="M120 28 C180 28 215 70 215 125 C215 180 175 212 120 212 C65 212 25 180 25 125 C25 70 60 28 120 28 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Flippers & Head -->
    <ellipse cx="60" cy="90" rx="30" ry="16" transform="rotate(-30 60 90)" fill="url(#turtle-skin)"/>
    <ellipse cx="180" cy="90" rx="30" ry="16" transform="rotate(30 180 90)" fill="url(#turtle-skin)"/>
    <ellipse cx="75" cy="170" rx="20" ry="12" transform="rotate(-40 75 170)" fill="url(#turtle-skin)"/>
    <ellipse cx="165" cy="170" rx="20" ry="12" transform="rotate(40 165 170)" fill="url(#turtle-skin)"/>
    <circle cx="120" cy="65" r="32" fill="url(#turtle-skin)"/>
    <!-- Shell -->
    <ellipse cx="120" cy="135" rx="55" ry="50" fill="url(#turtle-shell)"/>
    <!-- Shell Pattern Star -->
    <polygon points="120,105 132,122 152,122 136,135 142,155 120,143 98,155 104,135 88,122 108,122" fill="#FDE047" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="107" cy="60" r="9" fill="#0F172A"/>
    <circle cx="133" cy="60" r="9" fill="#0F172A"/>
    <circle cx="104" cy="57" r="3.5" fill="#FFFFFF"/>
    <circle cx="130" cy="57" r="3.5" fill="#FFFFFF"/>
    <!-- Cheeks & Smile -->
    <circle cx="98" cy="72" r="5" fill="#F472B6" opacity="0.6"/>
    <circle cx="142" cy="72" r="5" fill="#F472B6" opacity="0.6"/>
    <path d="M114 72 Q120 78 126 72" stroke="#064E3B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Sparkles & Bubbles -->
    <circle cx="175" cy="50" r="7" fill="#67E8F9" opacity="0.7"/>
    <circle cx="188" cy="40" r="4" fill="#67E8F9" opacity="0.7"/>
    <use href="#sparkle" x="50" y="55"/>
    <use href="#sparkle" x="190" y="140"/>
    <use href="#gold-star" x="120" y="132"/>
  </svg>