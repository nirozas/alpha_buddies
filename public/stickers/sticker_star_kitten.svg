<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <circle cx="120" cy="125" r="45" fill="#E0E7FF"/>
    <polygon points="85,95 70,55 105,80" fill="#818CF8"/>
    <polygon points="155,95 170,55 135,80" fill="#818CF8"/>
    <circle cx="102" cy="118" r="8" fill="#1E1B4B"/>
    <circle cx="138" cy="118" r="8" fill="#1E1B4B"/>
    <circle cx="100" cy="115" r="3" fill="#FFF"/>
    <circle cx="136" cy="115" r="3" fill="#FFF"/>
    <polygon points="120,126 116,132 124,132" fill="#F472B6"/>
    <!-- Whiskers -->
    <line x1="75" y1="125" x2="90" y2="125" stroke="#818CF8" stroke-width="2"/>
    <line x1="75" y1="132" x2="90" y2="130" stroke="#818CF8" stroke-width="2"/>
    <line x1="165" y1="125" x2="150" y2="125" stroke="#818CF8" stroke-width="2"/>
    <line x1="165" y1="132" x2="150" y2="130" stroke="#818CF8" stroke-width="2"/>
    <use href="#sparkle" x="55" y="60"/>
    <use href="#sparkle" x="185" y="60"/>
  
</svg>