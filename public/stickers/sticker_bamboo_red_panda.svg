<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Red Panda Ears -->
    <polygon points="75,95 65,55 105,80" fill="#EA580C"/>
    <polygon points="165,95 175,55 135,80" fill="#EA580C"/>
    <!-- Face -->
    <circle cx="120" cy="125" r="46" fill="#C2410C"/>
    <!-- White Marks -->
    <ellipse cx="94" cy="128" rx="10" ry="14" fill="#FFFFFF"/>
    <ellipse cx="146" cy="128" rx="10" ry="14" fill="#FFFFFF"/>
    <circle cx="102" cy="120" r="7" fill="#0F172A"/>
    <circle cx="138" cy="120" r="7" fill="#0F172A"/>
    <circle cx="100" cy="118" r="2.5" fill="#FFF"/>
    <circle cx="136" cy="118" r="2.5" fill="#FFF"/>
    <!-- Bamboo Shoot -->
    <rect x="115" y="150" width="10" height="35" rx="3" fill="#22C55E"/>
    <circle cx="120" cy="148" r="6" fill="#86EFAC"/>
    <use href="#sparkle" x="55" y="65"/>
    <use href="#sparkle" x="185" y="65"/>
  
</svg>