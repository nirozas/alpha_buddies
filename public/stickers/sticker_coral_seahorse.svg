<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="coral-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FB7185"/>
        <stop offset="50%" stop-color="#F43F5E"/>
        <stop offset="100%" stop-color="#E11D48"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Coral Crown -->
    <path d="M110 55 Q100 35 95 30 M120 50 Q120 30 120 25 M130 55 Q140 35 145 30" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <!-- Seahorse Head & Snout -->
    <ellipse cx="135" cy="85" rx="35" ry="28" fill="url(#coral-grad)"/>
    <path d="M165 85 L185 85 L180 95 L165 92 Z" fill="url(#coral-grad)"/>
    <!-- Body & Spiral Tail -->
    <path d="M120 105 C140 125 135 165 110 175 C85 185 85 155 105 155" fill="none" stroke="url(#coral-grad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Big Eye -->
    <circle cx="135" cy="80" r="10" fill="#0F172A"/>
    <circle cx="132" cy="77" r="4" fill="#FFFFFF"/>
    <use href="#sparkle" x="50" y="65"/>
    <use href="#sparkle" x="195" y="65"/>
    <use href="#gold-star" x="110" y="125"/>
  </svg>