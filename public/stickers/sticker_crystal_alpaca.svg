<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mintFluff" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A7F3D0"/><stop offset="100%" stop-color="#5EEAD4"/></linearGradient>
    <linearGradient id="goldStar" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FDE047"/><stop offset="100%" stop-color="#CA8A04"/></linearGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="#F0FDF4" opacity="0.7"/>
  <!-- Fluffy Cloud Body -->
  <circle cx="256" cy="340" r="80" fill="url(#mintFluff)"/>
  <circle cx="200" cy="360" r="70" fill="url(#mintFluff)"/>
  <circle cx="312" cy="360" r="70" fill="url(#mintFluff)"/>
  <!-- Long Fluffy Neck -->
  <rect x="226" y="190" width="60" height="130" rx="30" fill="url(#mintFluff)"/>
  <!-- Head -->
  <ellipse cx="256" cy="180" rx="65" ry="55" fill="url(#mintFluff)"/>
  <!-- Ears with star tips -->
  <ellipse cx="210" cy="115" rx="14" ry="35" transform="rotate(-15 210 115)" fill="#6EE7B7"/>
  <ellipse cx="302" cy="115" rx="14" ry="35" transform="rotate(15 302 115)" fill="#6EE7B7"/>
  <!-- Forehead Tuft -->
  <circle cx="256" cy="140" r="24" fill="#FFFFFF"/>
  <circle cx="240" cy="145" r="18" fill="#FFFFFF"/>
  <circle cx="272" cy="145" r="18" fill="#FFFFFF"/>
  <!-- Snout -->
  <ellipse cx="256" cy="195" rx="25" ry="18" fill="#FFFFFF"/>
  <ellipse cx="256" cy="190" rx="8" ry="6" fill="#F472B6"/>
  <!-- Eyes -->
  <circle cx="225" cy="170" r="12" fill="#0F172A"/>
  <circle cx="222" cy="166" r="4" fill="#FFFFFF"/>
  <circle cx="287" cy="170" r="12" fill="#0F172A"/>
  <circle cx="284" cy="166" r="4" fill="#FFFFFF"/>
  <!-- Cheeks -->
  <circle cx="205" cy="190" r="10" fill="#F472B6" opacity="0.8"/>
  <circle cx="307" cy="190" r="10" fill="#F472B6" opacity="0.8"/>
  <!-- Rainbow necklace -->
  <path d="M215 270 Q256 300 297 270" stroke="#F43F5E" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="305" r="16" fill="url(#goldStar)"/>
</svg>