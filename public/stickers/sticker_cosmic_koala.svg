<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="cosmic-koala" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#C084FC"/>
        <stop offset="60%" stop-color="#818CF8"/>
        <stop offset="100%" stop-color="#4F46E5"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 218 65 218 125 C218 185 180 215 120 215 C60 215 22 185 22 125 C22 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Fluffy Ears -->
    <circle cx="55" cy="75" r="28" fill="#818CF8"/>
    <circle cx="55" cy="75" r="17" fill="#E0E7FF"/>
    <circle cx="185" cy="75" r="28" fill="#818CF8"/>
    <circle cx="185" cy="75" r="17" fill="#E0E7FF"/>
    <!-- Body -->
    <ellipse cx="120" cy="145" rx="55" ry="55" fill="url(#cosmic-koala)"/>
    <circle cx="120" cy="95" r="48" fill="url(#cosmic-koala)"/>
    <!-- Big Shiny Koala Nose -->
    <ellipse cx="120" cy="100" rx="16" ry="22" fill="#1E1B4B"/>
    <ellipse cx="116" cy="93" rx="5" ry="7" fill="#FFFFFF" opacity="0.8"/>
    <!-- Eyes -->
    <circle cx="92" cy="85" r="9" fill="#0F172A"/>
    <circle cx="148" cy="85" r="9" fill="#0F172A"/>
    <circle cx="89" cy="82" r="3" fill="#FFFFFF"/>
    <circle cx="145" cy="82" r="3" fill="#FFFFFF"/>
    <!-- Glowing Starry Leaf -->
    <path d="M90 145 Q120 120 150 145 Q120 170 90 145 Z" fill="#38BDF8"/>
    <use href="#sparkle" x="120" y="145"/>
    <use href="#sparkle" x="50" y="140"/>
    <use href="#sparkle" x="190" y="140"/>
  </svg>