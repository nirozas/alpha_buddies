<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gliderWings" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#818CF8"/></linearGradient>
    <radialGradient id="bellySoft" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F1F5F9"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="#F8FAFC" opacity="0.6"/>
  <!-- Stretched Glider Wings -->
  <path d="M120 180 Q256 120 392 180 Q430 360 256 380 Q82 360 120 180 Z" fill="url(#gliderWings)"/>
  <!-- Constellation stars on wing flaps -->
  <circle cx="160" cy="260" r="5" fill="#FEF08A"/>
  <circle cx="200" cy="320" r="6" fill="#FEF08A"/>
  <circle cx="352" cy="260" r="5" fill="#FEF08A"/>
  <circle cx="312" cy="320" r="6" fill="#FEF08A"/>
  <line x1="160" y1="260" x2="200" y2="320" stroke="#FEF08A" stroke-width="2" opacity="0.7"/>
  <line x1="352" y1="260" x2="312" y2="320" stroke="#FEF08A" stroke-width="2" opacity="0.7"/>
  <!-- Chubby body -->
  <ellipse cx="256" cy="260" rx="75" ry="95" fill="#94A3B8"/>
  <ellipse cx="256" cy="270" rx="50" ry="70" fill="url(#bellySoft)"/>
  <!-- Giant Kawaii Eyes -->
  <circle cx="225" cy="210" r="20" fill="#0F172A"/>
  <circle cx="218" cy="202" r="8" fill="#FFFFFF"/>
  <circle cx="287" cy="210" r="20" fill="#0F172A"/>
  <circle cx="280" cy="202" r="8" fill="#FFFFFF"/>
  <!-- Tiny paws reaching out -->
  <ellipse cx="140" cy="180" rx="14" ry="12" fill="#F472B6"/>
  <ellipse cx="372" cy="180" rx="14" ry="12" fill="#F472B6"/>
  <circle cx="256" cy="235" r="7" fill="#F43F5E"/>
</svg>