<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Wings stretched -->
    <polygon points="120,110 55,90 75,160" fill="#CBD5E1"/>
    <polygon points="120,110 185,90 165,160" fill="#CBD5E1"/>
    <!-- Head & Body -->
    <circle cx="120" cy="125" r="40" fill="#E2E8F0"/>
    <polygon points="90,95 80,65 105,85" fill="#94A3B8"/>
    <polygon points="150,95 160,65 135,85" fill="#94A3B8"/>
    <!-- Giant Adorable Eyes -->
    <circle cx="104" cy="120" r="10" fill="#0F172A"/>
    <circle cx="136" cy="120" r="10" fill="#0F172A"/>
    <circle cx="101" cy="116" r="4" fill="#FFFFFF"/>
    <circle cx="133" cy="116" r="4" fill="#FFFFFF"/>
    <circle cx="88" cy="130" r="6" fill="#F472B6" opacity="0.6"/>
    <circle cx="152" cy="130" r="6" fill="#F472B6" opacity="0.6"/>
    <use href="#sparkle" x="50" y="65"/>
    <use href="#sparkle" x="190" y="65"/>
  
</svg>