<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="berry-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FB7185"/>
        <stop offset="60%" stop-color="#E11D48"/>
        <stop offset="100%" stop-color="#9F1239"/>
      </linearGradient>
    </defs>
    <path d="M120 22 C185 22 215 65 215 125 C215 185 180 218 120 218 C60 218 25 185 25 125 C25 65 55 22 120 22 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Tiny Wings -->
    <path d="M65 95 C40 60 30 110 70 125 Z" fill="#FDA4AF" stroke="#E11D48" stroke-width="2"/>
    <path d="M175 95 C200 60 210 110 170 125 Z" fill="#FDA4AF" stroke="#E11D48" stroke-width="2"/>
    <!-- Body & Head -->
    <ellipse cx="120" cy="145" rx="50" ry="52" fill="url(#berry-grad)"/>
    <circle cx="120" cy="85" r="42" fill="url(#berry-grad)"/>
    <!-- Cute Strawberry Horns -->
    <polygon points="95,50 85,30 105,45" fill="#34D399"/>
    <polygon points="145,50 155,30 135,45" fill="#34D399"/>
    <!-- Tummy -->
    <ellipse cx="120" cy="155" rx="30" ry="32" fill="#FFE4E6"/>
    <!-- Eyes -->
    <circle cx="102" cy="80" r="11" fill="#0F172A"/>
    <circle cx="138" cy="80" r="11" fill="#0F172A"/>
    <circle cx="98" cy="76" r="4" fill="#FFFFFF"/>
    <circle cx="134" cy="76" r="4" fill="#FFFFFF"/>
    <!-- Cute Snout & Smoke Puff -->
    <ellipse cx="120" cy="95" rx="14" ry="9" fill="#FDA4AF"/>
    <circle cx="116" cy="95" r="2" fill="#E11D48"/>
    <circle cx="124" cy="95" r="2" fill="#E11D48"/>
    <!-- Glitter Stars -->
    <use href="#sparkle" x="40" y="80"/>
    <use href="#sparkle" x="200" y="80"/>
    <use href="#gold-star" x="120" y="25"/>
  </svg>