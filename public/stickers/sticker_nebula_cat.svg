<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
    <defs>
      
  <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
  <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <g id="sparkle">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <g id="gold-star">
    <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
  </g>

      <linearGradient id="nebula-fur" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#C084FC"/>
        <stop offset="50%" stop-color="#4F46E5"/>
        <stop offset="100%" stop-color="#0F172A"/>
      </linearGradient>
    </defs>
    <path d="M120 25 C185 25 215 65 215 125 C215 185 180 215 120 215 C60 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
    <!-- Pointy Ears -->
    <polygon points="70,65 55,25 95,45" fill="#4F46E5"/>
    <polygon points="170,65 185,25 145,45" fill="#4F46E5"/>
    <!-- Body & Head -->
    <ellipse cx="120" cy="140" rx="50" ry="55" fill="url(#nebula-fur)"/>
    <circle cx="120" cy="85" r="45" fill="url(#nebula-fur)"/>
    <!-- Galaxy Swirl Tail -->
    <path d="M165 155 C200 160 205 110 180 100" fill="none" stroke="#C084FC" stroke-width="12" stroke-linecap="round"/>
    <!-- Starfield Eyes -->
    <circle cx="102" cy="85" r="13" fill="#F472B6"/>
    <circle cx="138" cy="85" r="13" fill="#38BDF8"/>
    <circle cx="98" cy="80" r="5" fill="#FFFFFF"/>
    <circle cx="134" cy="80" r="5" fill="#FFFFFF"/>
    <!-- Crescent Moon Mark on Forehead -->
    <path d="M120 50 C125 55 125 65 120 70 C128 65 128 55 120 50 Z" fill="#FDE047"/>
    <use href="#sparkle" x="45" y="95"/>
    <use href="#sparkle" x="195" y="95"/>
  </svg>