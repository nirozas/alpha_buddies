<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Fluffy Body -->
    <circle cx="120" cy="135" r="54" fill="#E0F2FE"/>
    <!-- Little Horns -->
    <polygon points="85,95 75,75 95,90" fill="#93C5FD"/>
    <polygon points="155,95 165,75 145,90" fill="#93C5FD"/>
    <!-- Warm Face Plate -->
    <ellipse cx="120" cy="130" rx="36" ry="30" fill="#BFDBFE"/>
    <!-- Friendly Big Eyes -->
    <circle cx="105" cy="125" r="8" fill="#0F172A"/>
    <circle cx="135" cy="125" r="8" fill="#0F172A"/>
    <circle cx="102" cy="122" r="3" fill="#FFF"/>
    <circle cx="132" cy="122" r="3" fill="#FFF"/>
    <!-- Happy Smile & Little Tooth -->
    <path d="M112 138 Q120 146 128 138" stroke="#0F172A" stroke-width="2.5" fill="none"/>
    <polygon points="116,138 120,138 118,143" fill="#FFFFFF"/>
    <!-- Cheeks -->
    <circle cx="94" cy="136" r="6" fill="#38BDF8" opacity="0.6"/>
    <circle cx="146" cy="136" r="6" fill="#38BDF8" opacity="0.6"/>
    <!-- Hot Cocoa Mug -->
    <rect x="108" y="160" width="24" height="22" rx="4" fill="#F87171"/>
    <path d="M120 156 Q122 150 120 145" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <use href="#sparkle" x="60" y="70"/>
    <use href="#sparkle" x="180" y="70"/>
  
</svg>