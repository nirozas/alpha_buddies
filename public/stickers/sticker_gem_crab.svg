<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gemShell" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E0E7FF"/><stop offset="50%" stop-color="#C7D2FE"/><stop offset="100%" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="crabRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#E11D48"/></linearGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="#EEF2FF" opacity="0.7"/>
  <!-- Faceted Diamond Conch Shell -->
  <path d="M180 180 Q320 80 390 190 Q430 300 300 350 Q160 360 140 260 Z" fill="url(#gemShell)"/>
  <!-- Shell facet lines -->
  <path d="M220 170 L340 220 L270 310 Z" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M320 120 L370 200 L320 270" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.8"/>
  <!-- Crab Peeking Out -->
