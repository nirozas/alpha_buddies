  <!-- Claws -->
  <path d="M120 250 Q90 220 80 250 Q100 270 125 260 Z" fill="url(#crabRed)"/>
  <path d="M150 340 Q110 360 120 380 Q145 370 160 345 Z" fill="url(#crabRed)"/>
  <!-- Stalk Eyes -->
  <ellipse cx="140" cy="215" rx="14" ry="18" fill="#FFFFFF"/>
  <circle cx="138" cy="215" r="9" fill="#0F172A"/>
  <circle cx="135" cy="212" r="3" fill="#FFFFFF"/>
  <ellipse cx="185" cy="215" rx="14" ry="18" fill="#FFFFFF"/>
  <circle cx="183" cy="215" r="9" fill="#0F172A"/>
  <circle cx="180" cy="212" r="3" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M150 255 Q165 265 180 255" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Sparkles -->
  <circle cx="340" cy="140" r="8" fill="#FEF08A"/>
  <circle cx="410" cy="240" r="10" fill="#67E8F9"/>
</svg>