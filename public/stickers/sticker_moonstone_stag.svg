<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="stagBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E0E7FF"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>
    <radialGradient id="starFlower" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FEF08A"/><stop offset="100%" stop-color="#F59E0B"/></radialGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="#EEF2FF" opacity="0.6"/>
  <!-- Glowing Antlers with star flowers -->
  <path d="M230 150 Q180 80 120 100 M170 115 Q140 60 170 50" stroke="#A5B4FC" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M282 150 Q332 80 392 100 M342 115 Q372 60 342 50" stroke="#A5B4FC" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Blooming star blossoms on antler tips -->
  <circle cx="120" cy="100" r="10" fill="url(#starFlower)"/>
  <circle cx="170" cy="50" r="8" fill="url(#starFlower)"/>
  <circle cx="392" cy="100" r="10" fill="url(#starFlower)"/>
  <circle cx="342" cy="50" r="8" fill="url(#starFlower)"/>
  <!-- Stag Neck & Head -->
  <path d="M226 360 L240 240 Q256 160 256 160 Q256 160 272 240 L286 360 Z" fill="url(#stagBlue)"/>
  <circle cx="256" cy="180" r="50" fill="url(#stagBlue)"/>
  <!-- Snout -->
  <ellipse cx="256" cy="205" rx="20" ry="14" fill="#FFFFFF"/>
  <ellipse cx="256" cy="200" rx="8" ry="5" fill="#1E1B4B"/>
  <!-- Eyes -->
  <circle cx="235" cy="170" r="10" fill="#0F172A"/>
  <circle cx="232" cy="167" r="4" fill="#FFFFFF"/>
  <circle cx="277" cy="170" r="10" fill="#0F172A"/>
  <circle cx="274" cy="167" r="4" fill="#FFFFFF"/>
</svg>