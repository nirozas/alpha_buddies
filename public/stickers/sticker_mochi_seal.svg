<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <linearGradient id="seal-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  <!-- Flippers -->
  <ellipse cx="65" cy="145" rx="18" ry="12" fill="#99F6E4" transform="rotate(-25 65 145)"/>
  <ellipse cx="175" cy="145" rx="18" ry="12" fill="#99F6E4" transform="rotate(25 175 145)"/>
  <!-- Chubby Body -->
  <ellipse cx="120" cy="130" rx="60" ry="52" fill="url(#seal-grad)"/>
  <!-- Cute Tail -->
  <ellipse cx="120" cy="180" rx="16" ry="10" fill="#99F6E4"/>
  <!-- Big Shiny Eyes -->
  <circle cx="100" cy="120" r="9" fill="#0F172A"/>
  <circle cx="140" cy="120" r="9" fill="#0F172A"/>
  <circle cx="97" cy="117" r="3.5" fill="#FFFFFF"/>
  <circle cx="137" cy="117" r="3.5" fill="#FFFFFF"/>
  <circle cx="103" cy="123" r="1.5" fill="#FFFFFF"/>
  <circle cx="143" cy="123" r="1.5" fill="#FFFFFF"/>
  <!-- Rosy Cheeks -->
  <circle cx="86" cy="130" r="8" fill="#F472B6" opacity="0.6"/>
  <circle cx="154" cy="130" r="8" fill="#F472B6" opacity="0.6"/>
  <!-- Snout & Nose -->
  <ellipse cx="120" cy="130" rx="12" ry="8" fill="#FFFFFF"/>
  <polygon points="120,126 116,131 124,131" fill="#0F172A"/>
  <!-- Little Star Bow -->
  <path d="M120 70 L123 78 L131 78 L125 83 L127 91 L120 86 L113 91 L115 83 L109 78 L117 78 Z" fill="#FACC15"/>
  <use href="#sparkle" x="55" y="75"/>
  <use href="#sparkle" x="185" y="85"/>
  <use href="#sparkle" x="120" y="55"/>
</svg>
