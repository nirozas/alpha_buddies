<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Corgi Big Ears -->
    <polygon points="75,100 65,45 105,80" fill="#FB923C"/>
    <polygon points="78,92 72,55 98,78" fill="#FBCFE8"/>
    <polygon points="165,100 175,45 135,80" fill="#FB923C"/>
    <polygon points="162,92 168,55 142,78" fill="#FBCFE8"/>
    <!-- Corgi Face -->
    <circle cx="120" cy="125" r="46" fill="#F97316"/>
    <!-- White Blaze -->
    <path d="M110 90 Q120 120 110 145 L130 145 Q120 120 130 90 Z" fill="#FFFFFF"/>
    <!-- Eyes -->
    <circle cx="98" cy="118" r="8" fill="#0F172A"/>
    <circle cx="142" cy="118" r="8" fill="#0F172A"/>
    <circle cx="96" cy="115" r="3" fill="#FFF"/>
    <circle cx="140" cy="115" r="3" fill="#FFF"/>
    <!-- Nose & Smile -->
    <ellipse cx="120" cy="134" rx="6" ry="4" fill="#0F172A"/>
    <path d="M116 138 Q120 143 124 138" stroke="#0F172A" stroke-width="2" fill="none"/>
    <!-- Comet Starlight Streak -->
    <path d="M70 170 Q120 185 170 170" stroke="#FDE047" stroke-width="8" stroke-linecap="round" fill="none"/>
    <use href="#sparkle" x="50" y="60"/>
    <use href="#sparkle" x="190" y="60"/>
    <use href="#gold-star" x="120" y="185"/>
  
</svg>