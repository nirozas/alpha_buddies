<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad_Y_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#D97706" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Badge Backdrop -->
  <circle cx="256" cy="256" r="235" fill="#FFFBEB"/>
  <circle cx="256" cy="256" r="215" fill="#FFFFFF" opacity="0.85"/>

  
    <!-- Royal Golden Jewel Crown -->
    <g transform="translate(186, 45)">
      <polygon points="0,70 20,20 70,55 120,20 140,70" fill="#FACC15" stroke="#CA8A04" stroke-width="6"/>
      <rect x="0" y="65" width="140" height="18" rx="8" fill="#EAB308"/>
      <!-- Jewels -->
      <circle cx="20" cy="20" r="10" fill="#F43F5E" stroke="#9F1239" stroke-width="2"/>
      <circle cx="70" cy="55" r="12" fill="#38BDF8" stroke="#0369A1" stroke-width="2"/>
      <circle cx="120" cy="20" r="10" fill="#10B981" stroke="#065F46" stroke-width="2"/>
      <circle cx="35" cy="74" r="5" fill="#FFFFFF"/>
      <circle cx="70" cy="74" r="6" fill="#F43F5E"/>
      <circle cx="105" cy="74" r="5" fill="#FFFFFF"/>
    </g>
    <!-- Royal Starburst Halo -->
    <circle cx="256" cy="256" r="215" stroke="#FDE047" stroke-width="6" stroke-dasharray="14 14" fill="none" opacity="0.8"/>
  

  <!-- Main Character Glyph (Giant, Bubbly & Friendly) -->
  <g filter="url(#shadow)">
    <text
      x="256"
      y="345"
      font-family="system-ui, -apple-system, 'Comic Sans MS', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
      font-size="240"
      font-weight="900"
      text-anchor="middle"
      fill="url(#grad_Y_gold)"
      stroke="#FFFFFF"
      stroke-width="14"
      paint-order="stroke fill"
    >Y</text>
  </g>

  <!-- Big Kawaii Eyes on Glyph -->
  <g transform="translate(0, 15)">
    <!-- Left Eye -->
    <ellipse cx="210" cy="240" rx="16" ry="22" fill="#0F172A"/>
    <circle cx="204" cy="232" r="7" fill="#FFFFFF"/>
    <circle cx="214" cy="248" r="3.5" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="302" cy="240" rx="16" ry="22" fill="#0F172A"/>
    <circle cx="296" cy="232" r="7" fill="#FFFFFF"/>
    <circle cx="306" cy="248" r="3.5" fill="#FFFFFF"/>

    <!-- Happy Little Mouth -->
    <path d="M242 265 Q256 280 270 265" stroke="#0F172A" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="180" cy="265" rx="16" ry="10" fill="#FB7185" opacity="0.8"/>
    <ellipse cx="332" cy="265" rx="16" ry="10" fill="#FB7185" opacity="0.8"/>
  </g>

  <!-- Sparkles & Glitter Elements -->
  <!-- Top Left Sparkle -->
  <polygon points="90,110 97,125 112,132 97,139 90,154 83,139 68,132 83,125" fill="#FDE047"/>
  <circle cx="120" cy="95" r="6" fill="#F472B6"/>

  <!-- Top Right Sparkle -->
  <polygon points="410,130 415,142 427,147 415,152 410,164 405,152 393,147 405,142" fill="#38BDF8"/>
  <circle cx="380" cy="115" r="5" fill="#FDE047"/>

  <!-- Bottom Left Sparkle -->
  <polygon points="100,370 106,382 118,387 106,392 100,404 94,392 82,387 94,382" fill="#A855F7"/>
  <circle cx="75" cy="355" r="7" fill="#FBBF24"/>

  <!-- Bottom Right Sparkle -->
  <polygon points="415,360 422,375 437,382 422,389 415,404 408,389 393,382 408,375" fill="#FDE047"/>
  <circle cx="435" cy="335" r="6" fill="#FB7185"/>

  <!-- Tier Badge Banner at Bottom -->
  <g transform="translate(156, 420)">
    <rect x="0" y="0" width="200" height="42" rx="21" fill="#FACC15" stroke="#CA8A04" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
    <text x="100" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#78350F">
      ★ CROWN MASTER ★
    </text>
  </g>
</svg>