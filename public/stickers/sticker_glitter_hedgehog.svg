<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <g id="sparkle">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFFBEB" filter="url(#soft-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
    </g>
    <g id="gold-star">
      <path d="M0 -7 L2 -2 L7 -2 L3 1 L5 6 L0 3 L-5 6 L-3 1 L-7 -2 L-2 -2 Z" fill="#FACC15"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF"/>
    </g>
  </defs>
  <!-- Die-cut white border -->
  <path d="M120 25 C185 25 215 65 215 125 C215 185 185 215 120 215 C55 215 25 185 25 125 C25 65 55 25 120 25 Z" fill="#FFFFFF" filter="url(#sticker-shadow)"/>
  
    <!-- Crystal Quills -->
    <g fill="#A7F3D0" stroke="#34D399" stroke-width="2">
      <polygon points="80,90 60,65 95,80"/>
      <polygon points="120,80 115,50 135,78"/>
      <polygon points="160,90 180,65 145,80"/>
      <polygon points="65,120 40,110 70,130"/>
      <polygon points="175,120 200,110 170,130"/>
      <polygon points="75,150 50,155 80,160"/>
      <polygon points="165,150 190,155 160,160"/>
    </g>
    <!-- Soft Chubby Belly -->
    <ellipse cx="120" cy="135" rx="46" ry="42" fill="#FEF3C7"/>
    <!-- Snout -->
    <circle cx="120" cy="130" r="14" fill="#FDE68A"/>
    <circle cx="120" cy="126" r="5" fill="#0F172A"/>
    <!-- Eyes -->
    <circle cx="102" cy="120" r="7" fill="#0F172A"/>
    <circle cx="138" cy="120" r="7" fill="#0F172A"/>
    <circle cx="100" cy="118" r="2.5" fill="#FFFFFF"/>
    <circle cx="136" cy="118" r="2.5" fill="#FFFFFF"/>
    <!-- Cheeks -->
    <circle cx="90" cy="132" r="6" fill="#F87171" opacity="0.5"/>
    <circle cx="150" cy="132" r="6" fill="#F87171" opacity="0.5"/>
    <use href="#sparkle" x="65" y="70"/>
    <use href="#sparkle" x="175" y="70"/>
  
</svg>