<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <linearGradient id="gold12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="112" fill="#EAB308" stroke="#FEF08A" stroke-width="4"/>
  <circle cx="120" cy="120" r="102" fill="#FFFFFF"/>
  <circle cx="120" cy="120" r="96" fill="url(#bg12)"/>

  <!-- Rotating ring of stars -->
  <circle cx="120" cy="115" r="65" fill="none" stroke="#FFFFFF" stroke-dasharray="8 12" stroke-width="3" opacity="0.6"/>

  <!-- Big 3D Star in Center -->
  <path d="M120 45 L138 90 L185 95 L150 125 L160 170 L120 145 L80 170 L90 125 L55 95 L102 90 Z" fill="url(#gold12)" stroke="#78350F" stroke-width="4" stroke-linejoin="round"/>
  <!-- Facet Highlight -->
  <polygon points="120,45 138,90 120,145 102,90" fill="#FFFFFF" opacity="0.5"/>

  <!-- 50 Badge in center -->
  <circle cx="120" cy="115" r="22" fill="#78350F" stroke="#FEF08A" stroke-width="3"/>
  <text x="120" y="123" font-family="'Nunito', sans-serif" font-weight="900" font-size="20" fill="#FEF08A" text-anchor="middle">50</text>

  <!-- Sparkles -->
  <circle cx="60" cy="65" r="4" fill="#FFFFFF"/>
  <circle cx="180" cy="65" r="4" fill="#FFFFFF"/>

  <!-- Banner -->
  <g transform="translate(0, 10)">
    <rect x="42" y="170" width="156" height="26" rx="13" fill="#D97706" stroke="#FFFFFF" stroke-width="3"/>
    <text x="120" y="187" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GOLDEN STARLIGHT</text>
  </g>
</svg>