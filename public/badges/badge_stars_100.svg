  <circle cx="120" cy="120" r="112" fill="#FACC15" stroke="#FEF08A" stroke-width="5"/>
  <circle cx="120" cy="120" r="102" fill="#FFFFFF"/>
  <circle cx="120" cy="120" r="96" fill="url(#bg13)"/>

  <!-- Ornate Golden Winner Trophy Cup -->
  <!-- Trophy handles -->
  <path d="M75 75 C50 75 50 115 75 115" fill="none" stroke="url(#trophy)" stroke-width="8" stroke-linecap="round"/>
  <path d="M165 75 C190 75 190 115 165 115" fill="none" stroke="url(#trophy)" stroke-width="8" stroke-linecap="round"/>

  <!-- Trophy Cup Body -->
  <path d="M75 65 L165 65 C165 115 140 135 120 135 C100 135 75 115 75 65 Z" fill="url(#trophy)" stroke="#78350F" stroke-width="3.5"/>
  <!-- Trophy Stem & Base -->
  <rect x="112" y="135" width="16" height="20" fill="url(#trophy)" stroke="#78350F" stroke-width="2"/>
  <polygon points="90,165 150,165 140,155 100,155" fill="url(#trophy)" stroke="#78350F" stroke-width="2.5"/>

