  <polygon points="90,48 94,56 102,57 96,63 98,71 90,67 82,71 84,63 78,57 86,56" fill="#FFFFFF"/>
  <polygon points="150,48 154,56 162,57 156,63 158,71 150,67 142,71 144,63 138,57 146,56" fill="#FFFFFF"/>

  <!-- Banner -->
  <g transform="translate(0, 10)">
    <rect x="40" y="170" width="160" height="26" rx="13" fill="#B45309" stroke="#FFFFFF" stroke-width="3"/>
    <text x="120" y="187" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CENTURION 100★</text>
