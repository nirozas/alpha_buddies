<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <linearGradient id="targetRing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>

  <!-- Border & Base -->
  <circle cx="120" cy="120" r="112" fill="#FEF08A" stroke="#B45309" stroke-width="4"/>
  <circle cx="120" cy="120" r="102" fill="#FFFFFF"/>
  <circle cx="120" cy="120" r="96" fill="url(#bg2)"/>

  <!-- Bullseye target rings -->
  <circle cx="120" cy="115" r="70" fill="#FFFFFF" stroke="#0284C7" stroke-width="6"/>
  <circle cx="120" cy="115" r="50" fill="url(#targetRing1)" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="120" cy="115" r="30" fill="#EF4444" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="120" cy="115" r="14" fill="#FEF08A" stroke="#B45309" stroke-width="3"/>

  <!-- Golden Arrow through bullseye -->
  <g transform="rotate(-35 120 115)">
    <!-- Arrow shaft -->
    <rect x="117" y="30" width="6" height="150" rx="3" fill="url(#gold2)" stroke="#78350F" stroke-width="2"/>
    <!-- Arrowhead -->
    <polygon points="120,20 108,44 132,44" fill="url(#gold2)" stroke="#78350F" stroke-width="2"/>
    <!-- Fletching -->
    <polygon points="120,175 106,190 120,185 134,190" fill="#EC4899" stroke="#9D174D" stroke-width="2"/>
  </g>

  <!-- Glitter sparkles -->
  <circle cx="55" cy="70" r="4" fill="#FFFFFF"/>
  <circle cx="185" cy="75" r="5" fill="#FEF08A"/>
  <circle cx="65" cy="160" r="3.5" fill="#FEF08A"/>
  <circle cx="180" cy="155" r="4" fill="#FFFFFF"/>
  <!-- Sparkle stars -->
  <path d="M120 40 Q120 46 126 46 Q120 46 120 52 Q120 46 114 46 Q120 46 120 40 Z" fill="#FFFFFF"/>

  <!-- Banner -->
  <g transform="translate(0, 10)">
    <rect x="44" y="170" width="152" height="26" rx="13" fill="#059669" stroke="#FFFFFF" stroke-width="3"/>
    <text x="120" y="187" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PERFECT SCORE</text>
  </g>
</svg>